<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lumovia</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:20px;background:#10182b;color:#eef4ff}h1{font-size:46px;color:#80cfff}section{padding:22px;background:#1c2a40;border-radius:14px;margin:20px 0}button,input,select{padding:10px;margin:6px;border-radius:8px}button{cursor:pointer}a{color:#80cfff}</style></head><body><h1>Lumovia</h1><p>Sample learning-path browsing prototype. Course delivery and accounts are not connected.</p><section><h2>Interactive demo</h2><input id="input" placeholder="Enter your topic / goal"><button id="btn">Add</button><ul id="list"></ul></section><p><small>Prototype only. No server-side storage or connected AI.</small></p><script>document.getElementById('btn').onclick=()=>{let v=document.getElementById('input').value.trim();if(v){let li=document.createElement('li');li.textContent=v;document.getElementById('list').append(li);document.getElementById('input').value=''}}</script></body></html>
